name: Build desktop applications

on:
  workflow_dispatch:
  push:
    branches:
      - main
    tags:
      - "v*"

permissions:
  contents: read

concurrency:
  group: desktop-build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-windows:
    name: Build Windows x64
    runs-on: windows-2022
    timeout-minutes: 45

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: resource/package-lock.json

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-msvc

      - name: Install frontend dependencies
        working-directory: resource
        run: npm ci

      - name: Build Windows application
        working-directory: resource
        shell: pwsh
        run: node desktop.mjs build --configured

      - name: Verify Windows application
        shell: pwsh
        run: |
          Get-Item "CodexTZBox.exe" |
            Select-Object Name, Length, LastWriteTime
          Get-FileHash "CodexTZBox.exe" -Algorithm SHA256

      - name: Upload Windows artifact
        uses: actions/upload-artifact@v4
        with:
          name: CodexTZBox-Windows-x64
          path: CodexTZBox.exe
          if-no-files-found: error
          retention-days: 30
          compression-level: 0

  publish-release:
    name: Publish GitHub Release
    if: startsWith(github.ref, 'refs/tags/v')
    needs:
      - build-windows
    runs-on: ubuntu-24.04
    permissions:
      contents: write

    steps:
      - name: Download Windows artifact
        uses: actions/download-artifact@v4
        with:
          name: CodexTZBox-Windows-x64
          path: release-assets

      - name: Generate SHA-256 checksums
        working-directory: release-assets
        run: sha256sum * > SHA256SUMS.txt

      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "${GITHUB_REF_NAME}" \
            "release-assets/CodexTZBox.exe" \
            "release-assets/SHA256SUMS.txt" \
            --repo "${GITHUB_REPOSITORY}" \
            --verify-tag \
            --generate-notes \
            --title "Codex 时区沙盒 ${GITHUB_REF_NAME}"
