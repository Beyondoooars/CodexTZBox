name: Build desktop applications

on:
  workflow_dispatch:
    inputs:
      version:
        description: '版本递增方式：patch / minor / major，或明确的 X.Y.Z'
        required: false
        default: patch
  push:
    branches:
      - main
    tags:
      - "v*"

permissions:
  contents: read

concurrency:
  group: desktop-build-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build-windows:
    name: Build Windows x64
    runs-on: windows-2022
    timeout-minutes: 45
    permissions:
      # 手动发布时需要把版本号提交写回 main 并打标签。
      contents: write
    outputs:
      version: ${{ steps.version.outputs.VERSION }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          # 写回版本号提交与打标签需要完整历史。
          fetch-depth: 0
          ref: ${{ github.event_name == 'workflow_dispatch' && 'main' || github.ref }}

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: resource/package-lock.json

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-msvc

      # 版本号必须在构建前确定：产物内嵌的版本来自 tauri.conf.json，
      # 而 --locked 构建要求 Cargo.lock 与 Cargo.toml 的版本一致。
      - name: Bump version
        if: github.event_name == 'workflow_dispatch'
        shell: pwsh
        env:
          BUMP: ${{ inputs.version || 'patch' }}
        run: node scripts/bump-version.mjs $env:BUMP

      - name: Align version with tag
        if: startsWith(github.ref, 'refs/tags/v')
        shell: pwsh
        run: node scripts/bump-version.mjs $env:GITHUB_REF_NAME

      - name: Read version
        id: version
        shell: pwsh
        run: |
          $version = node -p "require('./resource/package.json').version"
          "VERSION=$version" >> $env:GITHUB_OUTPUT
          "VERSION=$version" >> $env:GITHUB_ENV

      - name: Install frontend dependencies
        working-directory: resource
        run: npm ci

      - name: Build Windows application
        working-directory: resource
        shell: pwsh
        run: node desktop.mjs build --configured

      - name: Verify Windows application
        shell: pwsh
        run: |
          Get-Item "CodexTZBox.exe" |
            Select-Object Name, Length, LastWriteTime
          Get-FileHash "CodexTZBox.exe" -Algorithm SHA256

      - name: Upload Windows artifact
        uses: actions/upload-artifact@v7
        with:
          name: CodexTZBox-Windows-x64
          path: CodexTZBox.exe
          if-no-files-found: error
          retention-days: 30
          compression-level: 0

      # 产物校验通过后再写回版本号并打标签：构建失败时仓库里不会留下
      # 一个没有对应产物的版本号。用 GITHUB_TOKEN 推送不会再次触发工作流，
      # 因此标签不会引发第二轮构建。
      - name: Commit version bump and tag
        if: github.event_name == 'workflow_dispatch'
        shell: pwsh
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add resource/package.json resource/package-lock.json resource/src-tauri/tauri.conf.json resource/src-tauri/Cargo.toml resource/src-tauri/Cargo.lock
          # 显式指定了与当前相同的版本号时文件没有变化，仍需一次提交作为标签的落点。
          git commit --allow-empty -m "chore: 发布 v$env:VERSION [skip ci]"
          # 构建过程可能在工作区留下未暂存改动，而 git pull --rebase 要求工作区
          # 干净：拉取时必须自动暂存，否则重试一次都跑不完。pull 失败才抛错——
          # 首次推送失败不一定是冲突，直接放弃会把偶发的网络错误当成冲突。
          for ($attempt = 1; $attempt -le 3; $attempt++) {
            git push origin HEAD:main
            if ($LASTEXITCODE -eq 0) { break }
            if ($attempt -eq 3) { throw '版本号提交推送失败' }
            git -c rebase.autoStash=true pull --rebase origin main
            if ($LASTEXITCODE -ne 0) {
              "第 $attempt 次同步 origin/main 失败，当前工作区：" | Out-Host
              git status --short | Out-Host
              throw '版本号提交推送失败'
            }
          }
          git tag "v$env:VERSION"
          git push origin "v$env:VERSION"

  publish-release:
    name: Publish GitHub Release
    if: github.event_name == 'workflow_dispatch' || startsWith(github.ref, 'refs/tags/v')
    needs:
      - build-windows
    runs-on: ubuntu-24.04
    permissions:
      contents: write

    steps:
      # 生成发布说明要读提交历史与 scripts/，因此需要检出代码；
      # 用 fetch-depth: 0 才能找到上一个版本 tag。
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Download Windows artifact
        uses: actions/download-artifact@v8
        with:
          name: CodexTZBox-Windows-x64
          path: release-assets

      - name: Generate SHA-256 checksums
        working-directory: release-assets
        run: sha256sum * > SHA256SUMS.txt

      # 发布说明按提交类型分组生成，理由见脚本头部注释：
      # GitHub 的 --generate-notes 只统计 PR，本仓库直接推 main，正文会几乎是空的。
      - name: Generate release notes
        run: node scripts/release-notes.mjs "$VERSION" release-notes.md
        env:
          VERSION: ${{ needs.build-windows.outputs.version }}

      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ needs.build-windows.outputs.version }}
        run: |
          tag="v${VERSION}"
          # 手动发布时标签由构建任务推送，tag 触发的构建里它已存在；
          # --verify-tag 会在这两种情况下都确认标签真的指向一个提交。
          gh release create "$tag" \
            "release-assets/CodexTZBox.exe" \
            "release-assets/SHA256SUMS.txt" \
            --repo "${GITHUB_REPOSITORY}" \
            --verify-tag \
            --notes-file release-notes.md \
            --title "Codex 时区沙盒 $tag"
